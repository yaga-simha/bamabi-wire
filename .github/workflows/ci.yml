name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-and-tests:
    name: Quality, Wire Targets & Tests
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Formatting, headers, benchmark docs, isolation, clippy & rustdoc
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask fmt
          cargo xtask header --check
          cargo xtask gen-component-headers --check
          cargo xtask bench --check-docs
          cargo xtask lint

      - name: Run Layer 0 test suites
        run: cargo xtask test

      - name: Verify standalone C99 header & layout suite
        run: cargo xtask c-test --no-asan

  static-wire-and-audit:
    name: 32-bit/Wasm Wire, Typos, Deny, SemVer & C99 Sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain + i686 & wasm32 targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Spellcheck repository (`typos`)
        uses: crate-ci/typos@v1.31.1

      - name: Install `cargo-deny`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cross-target (`i686` & `wasm32`) wire checks & `cargo-deny` audit
        run: cargo xtask audit --skip-typos

      - name: Run `standalone_c_test` under ASan + UBSan
        run: cargo xtask c-test --asan-only

      - name: Install `cargo-semver-checks`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: SemVer compatibility check on `bamabi_sys`
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          extract_toml_version() {
            local section="$1"
            awk -v sec="$section" '
              /^\[/ {
                hdr = $0
                sub(/[[:space:]]*(#.*)?$/, "", hdr)
                in_sec = (hdr == "[" sec "]")
                next
              }
              in_sec && !done && /^[[:space:]]*version[[:space:]]*=[[:space:]]*"/ {
                line = $0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                done = 1
              }
            '
          }

          read_sys_ver() {
            local rev="$1"
            local pkg_toml ws_toml
            if [ "$rev" = "WORKTREE" ]; then
              pkg_toml="$(cat crates/bamabi_sys/Cargo.toml)"
              ws_toml="$(cat Cargo.toml)"
            else
              pkg_toml="$(git show "${rev}:crates/bamabi_sys/Cargo.toml" 2>/dev/null || true)"
              ws_toml="$(git show "${rev}:Cargo.toml" 2>/dev/null || true)"
            fi
            [ -n "$pkg_toml" ] || return 0
            if printf '%s\n' "$pkg_toml" | awk '
              /^\[/ {
                hdr = $0
                sub(/[[:space:]]*(#.*)?$/, "", hdr)
                in_pkg = (hdr == "[package]")
                next
              }
              in_pkg && ( \
                /^[[:space:]]*version\.workspace[[:space:]]*=[[:space:]]*true/ || \
                /^[[:space:]]*version[[:space:]]*=[[:space:]]*\{[^}]*workspace[[:space:]]*=[[:space:]]*true/ \
              ) {
                found = 1
              }
              END { exit(found ? 0 : 1) }
            '; then
              printf '%s\n' "$ws_toml" | extract_toml_version "workspace.package"
            else
              printf '%s\n' "$pkg_toml" | extract_toml_version "package"
            fi
          }

          CUR_VER="$(read_sys_ver WORKTREE)"
          if [ -z "$CUR_VER" ]; then
            echo "ERROR: could not read current bamabi_sys version." >&2
            exit 1
          fi
          CUR_MM="$(printf '%s' "$CUR_VER" | cut -d. -f1,2)"
          LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

          if [ -n "$LATEST_TAG" ]; then
            TAG_VER="$(read_sys_ver "$LATEST_TAG")"
            TAG_MM="$(printf '%s' "$TAG_VER" | cut -d. -f1,2)"
            if [ -n "$TAG_VER" ] && [ "$TAG_MM" = "$CUR_MM" ]; then
              echo "Running cargo-semver-checks against release tag $LATEST_TAG ($TAG_VER) for $CUR_VER."
              cargo semver-checks check-release -p bamabi_sys --baseline-rev "$LATEST_TAG"
              exit 0
            fi
            echo "Skipping release-tag baseline $LATEST_TAG (${TAG_VER:-unknown}, major.minor=${TAG_MM:-unknown}): intentional bump to $CUR_VER (major.minor=$CUR_MM)."
          else
            echo "No reachable v* release tag found yet; skipping tag-based SemVer baseline for $CUR_VER."
          fi

          if [ -n "${PR_BASE:-}" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            BASE_VER="$(read_sys_ver "$PR_BASE")"
            if [ "$BASE_VER" = "$CUR_VER" ]; then
              echo "Running cargo-semver-checks against PR base $PR_BASE ($BASE_VER)."
              cargo semver-checks check-release -p bamabi_sys --baseline-rev "$PR_BASE"
            else
              echo "Skipping PR base $PR_BASE (${BASE_VER:-unknown}): bamabi_sys version changed ($BASE_VER -> $CUR_VER)."
            fi
          else
            echo "No matching release tag or PR base baseline applies on this push; SemVer check complete."
          fi

  miri:
    name: Miri (Tree Borrows + Stacked Borrows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup Miri sysroot
        run: cargo +nightly miri setup

      - name: Cache Cargo & Miri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-wire

      - name: Run Miri (Tree Borrows + Stacked Borrows) on `bamabi_sys`, `bamabi_guest_sys`, `bamabi_guest`, and `bamabi_macros`
        run: cargo xtask miri

  kani:
    name: Kani Formal Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify `bamabi_sys` (PO-W1..PO-W8) & `bamabi_guest_sys` (PO-G1..PO-G10, parallel) with Kani
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.68.0'
          args: >-
            -p bamabi_sys -p bamabi_guest_sys
            -Z unstable-options
            --harness-timeout 15m
            --output-format terse
            -j
            --harness po_
            --harness kani_proof_raw_msg_stack_scratch_alignment_and_bounds
            --harness kani_proof_drain_messages_conservation_and_ramp

      # `kani_proof_drain_messages_small_batch_ramp` (~7.5 GB RSS) and
      # `kani_proof_drain_messages_pre_reserved_exact_fit` (~9.4 GB RSS) exceed
      # 16 GB GitHub runner RAM if verified concurrently under `-j`.
      - name: Verify memory-heavy PO-G10 drain harnesses serially
        run: >-
          cargo kani
          -p bamabi_guest_sys
          -Z unstable-options
          --harness-timeout 15m
          --output-format terse
          --harness kani_proof_drain_messages_small_batch_ramp
          --harness kani_proof_drain_messages_pre_reserved_exact_fit

  benchmarks:
    name: Polyglot Benchmarks (Rust, C99, C++17, Zig)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify C99 and C++17 compilers
        shell: bash
        run: |
          set -euo pipefail
          cc --version
          c++ --version
          zig version

      - name: Run polyglot benchmark suite and update BENCHMARKS.md report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
            cargo xtask bench --strict-langs --write-docs --json target/bench-results.json
          else
            cargo xtask bench --quick --strict-langs --write-docs --json target/bench-results.json
          fi
          cat target/bench-summary.md >> "$GITHUB_STEP_SUMMARY"
          RUSTDOCFLAGS="-D warnings" cargo doc -p bamabi_docs --no-deps

      - name: Upload benchmark JSON, Markdown report & updated BENCHMARKS.md artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            target/bench-results.json
            target/bench-summary.md
            BENCHMARKS.md
          if-no-files-found: warn

      - name: Commit updated BENCHMARKS.md report on main/master
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- BENCHMARKS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BENCHMARKS.md
            git commit -m "chore(bench): update BENCHMARKS.md report [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
